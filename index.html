<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Mastery</title>
    <!-- Import Styles -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3.0.11/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div
          class="toast align-items-center text-bg-success border-0"
          :class="{ show: toast }"
        >
          <div class="d-flex">
            <div class="toast-body">{{ toast }}</div>
            <button
              class="btn-close btn-close-white me-2 m-auto"
              @click="toast = null"
            ></button>
          </div>
        </div>
      </div>
      <nav class="navbar navbar-dark bg-dark shadow-sm mb-5">
        <div class="container">
          <span class="navbar-brand fw-bold">Vue Mastery</span>
          <span class="btn btn-outline-light position-relative">
            Cart
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success"
            >
              {{ cart }}
            </span>
          </span>
        </div>
      </nav>
      <cart-list :items="cart"></cart-list>

      <main class="container">
        <product-display
          :premium="premium"
          @add-to-cart="updateCart"
          @remove-from-cart="removeFromCart"
        ></product-display>
      </main>
    </div>

    <!-- Import Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Import App -->
    <script>
      const app = Vue.createApp({
        data() {
          return {
            cart: [],
            premium: true,
            toast: null,
          };
        },
        methods: {
          updateCart(id) {
            this.cart.push(id);
            this.toast = "article ajouté au panier";
            setTimeout(() => {
              this.toast = null;
            }, 3000);
          },
          removeFromCart(id) {
            const index = this.cart.indexOf(id);
            if (index !== -1) this.cart.splice(index, 1);
            this.toast = "article retiré du panier";
            setTimeout(() => {
              this.toast = null;
            }, 3000);
          },
        },
      });
    </script>

    <!-- Import Components -->
    <script src="./components/ProductDisplay.js"></script>
    <script src="./components/CartList.js"></script>

    <!-- Mount App -->
    <script>
      const mountedApp = app.mount("#app");
    </script>
  </body>
</html>
