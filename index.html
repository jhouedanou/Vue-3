<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Mastery</title>
    <!-- Import Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3.0.11/dist/vue.global.js"></script>
  </head>
  <body class="min-h-screen bg-slate-100 font-sans text-slate-800">
    <div id="app">
      <nav class="mb-10 bg-slate-800 shadow">
        <div
          class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4"
        >
          <span class="text-lg font-bold text-white">Vue Mastery</span>
          <span
            class="rounded-full bg-white px-4 py-2 text-sm font-semibold text-slate-800 shadow"
          >
            Cart ({{ cart.length }})
          </span>
        </div>
      </nav>

      <main class="mx-auto max-w-5xl px-4 pb-16">
        <product-display
          :premium="premium"
          @add-to-cart="updateCart"
        ></product-display>
      </main>
    </div>

    <!-- Import App -->
    <script src="./main.js"></script>

    <!-- Import Components -->
    <script src="./components/ProductDisplay.js"></script>
    <script src="./components/reviewForm.js"></script>
    <script src="./components/reviewList.js"></script>
    <!-- Mount App -->
    <script>
      const mountedApp = app.mount("#app");
    </script>
  </body>
</html>
